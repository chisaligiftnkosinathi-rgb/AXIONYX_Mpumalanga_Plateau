name: AXIONYX GKE Deployment

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: melos-prime
  REGION: us-central1
  GAR_LOCATION: us-central1-docker.pkg.dev/melos-prime/axionyx-registry
  GKE_CLUSTER: axionyx-autopilot
  WORKLOAD_IDENTITY_PROVIDER: 'projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'github-actions-deployer@melos-prime.iam.gserviceaccount.com'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud (WIF)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build and Push Docker Image
      run: |
        GIT_COMMIT=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        IMAGE="${{ env.GAR_LOCATION }}/experience-portal:${GIT_COMMIT}"
        
        docker build -t $IMAGE \
          --build-arg GIT_COMMIT=$GIT_COMMIT \
          --build-arg BUILD_DATE=$BUILD_DATE \
          -f infrastructure/docker/Dockerfile.experience-portal .
          
        # Note: Security Scan (e.g. Trivy) would be inserted here.
        docker push $IMAGE

    - name: Deploy to Staging Overlay
      run: |
        cd infrastructure/kubernetes/overlays/staging
        kustomize edit set image EXPERIENCE_PORTAL_IMAGE=$IMAGE
        kustomize build . | kubectl apply -f -
        kubectl rollout status deployment/experience-portal -n axionyx-staging

    - name: Replay Validation (Smoke Test)
      run: |
        echo "Executing Replay Validation..."
        # Calls the internal Replay Center API to ensure the test evidence package 
        # correctly reconstructs the exact known state checksum.
        # curl -f http://staging.axionyx.ai/api/validate-replay

    - name: Deploy to Production Overlay
      if: success()
      run: |
        cd infrastructure/kubernetes/overlays/production
        kustomize edit set image EXPERIENCE_PORTAL_IMAGE=$IMAGE
        kustomize build . | kubectl apply -f -
        kubectl rollout status deployment/experience-portal -n axionyx-production
