version: '3.8'

services:
  axionyx-api:
    build: 
      context: ../apps/production-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=axionyx
      - DB_PASS=axionyx_secure_123
      - DB_NAME=axionyx_platform
      - REDIS_URL=redis://redis:6379
      - META_VERIFY_TOKEN=AXIONYX_VERIFY_TOKEN
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - axionyx-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deploy/public_www:/usr/share/nginx/html:ro
    depends_on:
      - axionyx-api
    networks:
      - axionyx-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: axionyx
      POSTGRES_PASSWORD: axionyx_secure_123
      POSTGRES_DB: axionyx_platform
    volumes:
      - ./database:/var/lib/postgresql/data
      - ../database/schemas:/docker-entrypoint-initdb.d
    networks:
      - axionyx-net

  redis:
    image: redis:7-alpine
    networks:
      - axionyx-net

networks:
  axionyx-net:
    driver: bridge
