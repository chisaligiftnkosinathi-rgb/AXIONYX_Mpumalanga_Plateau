events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    upstream axionyx_api {
        server axionyx-api:3000;
    }

    server {
        listen 80;
        server_name axionyx.co.za www.axionyx.co.za;

        # Serve Public Discovery Interface (Chappies)
        location /chappies {
            alias /usr/share/nginx/html/chappies/;
            index index.html;
        }

        # Serve Partner Portal (Mad Cars)
        location /partners {
            alias /usr/share/nginx/html/partners/;
            index index.html;
        }

        # Serve Economic Observatory Command Centre
        location /observatory {
            alias /usr/share/nginx/html/observatory/;
            index index.html;
        }

        # Route API / Webhooks to Express backend
        location /api/ {
            proxy_pass http://axionyx_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Root redirect
        location / {
            return 301 /chappies;
        }
    }
}
