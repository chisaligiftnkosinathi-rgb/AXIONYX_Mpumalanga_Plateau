version: '3.8'

services:
  # The Core API (Kernel Adapter)
  axionyx-api:
    build: 
      context: ../apps/axionyx-api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://axionyx:local@postgres:5432/axionyx
      - REDIS_URL=redis://redis:6379

  # The Asynchronous Worker
  axionyx-worker:
    build:
      context: ../apps/axionyx-worker
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy

  # Local Infrastructure Requirements
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: axionyx
      POSTGRES_PASSWORD: local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axionyx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001" # WebSockets

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
