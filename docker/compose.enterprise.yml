version: '3.8'

# Extending the profile for Enterprise telemetry ingestion and observability

services:
  # Local placeholders for Enterprise Adapters (e.g., Supabase / BigQuery / PubSub)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: axionyx
      POSTGRES_PASSWORD: enterprise

  mqtt:
    image: eclipse-mosquitto:2

  # Observability
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - "16686:16686"

  axionyx-api:
    build: ../apps/axionyx-api

  axionyx-worker:
    build: ../apps/axionyx-worker
