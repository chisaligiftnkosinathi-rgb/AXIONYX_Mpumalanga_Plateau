apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instruments.axionyx.io
spec:
  group: axionyx.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                id:
                  type: string
                profile:
                  type: string
                packs:
                  type: array
                  items:
                    type: string
                federation:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    exports:
                      type: array
                      items:
                        type: string
                    imports:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                healthScore:
                  type: number
                lastCalibrated:
                  type: string
  scope: Namespaced
  names:
    plural: instruments
    singular: instrument
    kind: Instrument
    shortNames:
    - inst
