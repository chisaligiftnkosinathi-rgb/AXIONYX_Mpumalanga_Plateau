[project]
name = "axionyx-media-pipeline"
version = "1.0.0"
description = "AXIONYX Render Graph and Media Compositor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "moviepy>=1.0.3",
    "manim>=0.18.0",
    "opencv-python>=4.8.1",
    "pydub>=0.25.1",
    "cairosvg>=2.7.1",
    "Pillow>=10.1.0",
    "srt>=3.5.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
